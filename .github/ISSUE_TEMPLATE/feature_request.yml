name: Feature request
description: Suggest an improvement or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The problem or use case, in your own words.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: How you would like it to work.
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Valves, router, gateway, Bluetooth adapter or proxy, if relevant.
