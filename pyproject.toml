[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "localtrv"
version = "0.2.0"
description = "Local Bluetooth control for Viessmann ViCare radiator valves through a ubisys R0."
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jurgenj136" }]
keywords = ["zigbee", "zigbee-direct", "ble", "viessmann", "home-assistant"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42",
    "bleak>=1.0",
    "bleak-retry-connector>=4.7",
]

[project.scripts]
localtrv = "localtrv.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
    # HA core's own test harness; release tracks Home Assistant, upgrade them together.
    # The bluetooth extra pins HA's bluetooth/usb/hassio requirements.
    "pytest-homeassistant[bluetooth]==2026.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/localtrv"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tests/components/localtrv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "S", "C4", "PIE", "PT", "RET", "TC"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "custom_components", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# -p no:respx: let HA install its httpx alias before respx imports httpx.
addopts = "-p no:respx --cov=localtrv --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
